<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" role="img" aria-labelledby="title desc">
  <title id="title">Large-Scale CO2 Emissions in tonnes</title>
  <desc id="desc">A horizontal bar chart comparing Training GPT-3 at 552 tonnes, lifetime emissions of 10 cars at 250 tonnes, 5 years in a U.S. household at 240 tonnes, lifecycle emissions of 5,000 phones at 455 tonnes, and carbon absorbed by 10,000 trees in a year at 217.72 tonnes.</desc>
  <rect x="6" y="6" width="1048" height="408" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
  <text x="28" y="62" fill="#050505" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Large-Scale CO2 Emissions (in tonnes)</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22">
    <g transform="translate(28 110)">
      <text x="0" y="18" font-weight="700">Training GPT-3</text>
      <rect x="392" y="-10" width="612" height="34" fill="#f0f0f0"/>
      <rect x="392" y="-10" width="612" height="34" fill="#35a6cb"/>
      <text x="402" y="14" fill="#fff" font-weight="700">552</text>
      <line x1="0" x2="1004" y1="34" y2="34" stroke="#d6d6d6" stroke-dasharray="2 2"/>
    </g>
    <g transform="translate(28 162)">
      <text x="0" y="18">Lifetime emissions of 10 cars</text>
      <rect x="392" y="-10" width="612" height="34" fill="#f0f0f0"/>
      <rect x="392" y="-10" width="277" height="34" fill="#35a6cb"/>
      <text x="402" y="14" fill="#fff" font-weight="700">250</text>
      <line x1="0" x2="1004" y1="34" y2="34" stroke="#d6d6d6" stroke-dasharray="2 2"/>
    </g>
    <g transform="translate(28 214)">
      <text x="0" y="18">5 years in a U.S. household</text>
      <rect x="392" y="-10" width="612" height="34" fill="#f0f0f0"/>
      <rect x="392" y="-10" width="266" height="34" fill="#35a6cb"/>
      <text x="402" y="14" fill="#fff" font-weight="700">240</text>
      <line x1="0" x2="1004" y1="34" y2="34" stroke="#d6d6d6" stroke-dasharray="2 2"/>
    </g>
    <g transform="translate(28 266)">
      <text x="0" y="18">Lifecycle emissions of 5,000 phones</text>
      <rect x="392" y="-10" width="612" height="34" fill="#f0f0f0"/>
      <rect x="392" y="-10" width="505" height="34" fill="#35a6cb"/>
      <text x="402" y="14" fill="#fff" font-weight="700">455</text>
      <line x1="0" x2="1004" y1="34" y2="34" stroke="#d6d6d6" stroke-dasharray="2 2"/>
    </g>
    <g transform="translate(28 318)">
      <text x="0" y="0" font-weight="700">Absorbed (not emitted) by 10,000 trees in</text>
      <text x="0" y="28" font-weight="700">a year</text>
      <rect x="392" y="-10" width="612" height="34" fill="#f0f0f0"/>
      <rect x="392" y="-10" width="241" height="34" fill="#35a6cb"/>
      <text x="402" y="14" fill="#fff" font-weight="700">217.72</text>
    </g>
  </g>
  <text x="28" y="395" fill="#1a9bd7" font-family="Arial, Helvetica, sans-serif" font-size="20">Get the data</text>
  <text x="140" y="395" fill="#8c8c8c" font-family="Arial, Helvetica, sans-serif" font-size="20">• Created with </text>
  <text x="270" y="395" fill="#1a9bd7" font-family="Arial, Helvetica, sans-serif" font-size="20">Datawrapper</text>
</svg>
